; Mini ESP32 rover firmware (PlatformIO).
;
; The XIAO ESP32-C6 needs Arduino-ESP32 core 3.x, which the stock PlatformIO
; espressif32 platform does not ship, so this uses the community "pioarduino"
; platform build. For a XIAO ESP32-C3 or -S3, use the matching env below.

[platformio]
default_envs = xiao_c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:xiao_c6]
board = seeed_xiao_esp32c6

[env:xiao_c3]
board = seeed_xiao_esp32c3

[env:xiao_s3]
board = seeed_xiao_esp32s3
