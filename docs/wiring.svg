<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 1040 570" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect y="100" width="1040" height="570" fill="#ffffff"/>
  <text x="40" y="140" font-size="22" font-weight="bold" fill="#1c2430">Mini rover wiring</text>
  <text x="40" y="164" fill="#5a6472">Solder wires straight to the pads. Dashed parts are optional.</text>

  <!-- power rails -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 300 V250 H200 M260 250 H980 V380 M420 250 V330 M730 250 V300" stroke="#d6362b"/>
    <path d="M80 420 V620 H980 V420 M420 550 V620 M730 550 V620" stroke="#1c2430"/>
  </g>
  <g fill="#d6362b"><circle cx="420" cy="250" r="6"/><circle cx="730" cy="250" r="6"/></g>
  <g fill="#1c2430"><circle cx="420" cy="620" r="6"/><circle cx="730" cy="620" r="6"/></g>
  <text x="290" y="238" fill="#d6362b" font-weight="bold">battery +</text>
  <text x="180" y="644" fill="#1c2430" font-weight="bold">battery − / ground</text>

  <!-- switch (optional) -->
  <g stroke="#d6362b" stroke-width="4" fill="#ffffff" stroke-linecap="round">
    <path d="M200 250 L252 228" fill="none" stroke-dasharray="7 6"/>
    <circle cx="200" cy="250" r="6"/><circle cx="260" cy="250" r="6"/>
  </g>
  <text x="230" y="208" text-anchor="middle" fill="#5a6472">slide switch</text>

  <!-- battery -->
  <rect x="40" y="300" width="140" height="120" rx="10" fill="#f4e7b4" stroke="#8a7a3a" stroke-width="2"/>
  <text x="110" y="352" text-anchor="middle" font-weight="bold" fill="#1c2430">LiPo</text>
  <text x="110" y="374" text-anchor="middle" fill="#1c2430">3.7 V 300 mAh</text>
  <text x="140" y="320" text-anchor="middle" fill="#d6362b" font-weight="bold">+</text>
  <text x="80" y="412" text-anchor="middle" fill="#1c2430" font-weight="bold">−</text>

  <!-- XIAO -->
  <rect x="330" y="330" width="180" height="220" rx="10" fill="#dcefe2" stroke="#2f7d4f" stroke-width="2"/>
  <text x="420" y="430" text-anchor="middle" font-weight="bold" fill="#1c2430">XIAO ESP32-C6</text>
  <text x="420" y="452" text-anchor="middle" fill="#5a6472" font-size="13">BAT pads are on</text>
  <text x="420" y="469" text-anchor="middle" fill="#5a6472" font-size="13">the underside</text>
  <text x="420" y="350" text-anchor="middle" fill="#d6362b">BAT+</text>
  <text x="420" y="542" text-anchor="middle" fill="#1c2430">BAT−</text>
  <g text-anchor="end" fill="#1c2430">
    <text x="502" y="375">D0</text><text x="502" y="405">D1</text>
    <text x="502" y="435">D2</text><text x="502" y="465">D3</text><text x="502" y="505">3V3</text>
  </g>

  <!-- signals -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M510 370 H640" stroke="#2f6fd6"/><path d="M510 400 H640" stroke="#2f6fd6"/>
    <path d="M510 430 H640" stroke="#e08a1e"/><path d="M510 460 H640" stroke="#e08a1e"/>
    <path d="M510 500 H640" stroke="#8a8f98" stroke-dasharray="7 6"/>
  </g>
  <text x="575" y="524" text-anchor="middle" fill="#5a6472" font-size="13">only if motors</text>
  <text x="575" y="540" text-anchor="middle" fill="#5a6472" font-size="13">stay dead</text>

  <!-- DRV8833 -->
  <rect x="640" y="300" width="180" height="250" rx="10" fill="#e6e0f3" stroke="#5b4a9c" stroke-width="2"/>
  <text x="730" y="420" text-anchor="middle" font-weight="bold" fill="#1c2430">DRV8833</text>
  <text x="730" y="320" text-anchor="middle" fill="#d6362b">VCC</text>
  <text x="730" y="542" text-anchor="middle" fill="#1c2430">GND</text>
  <g fill="#1c2430">
    <text x="648" y="375">IN1</text><text x="648" y="405">IN2</text>
    <text x="648" y="435">IN3</text><text x="648" y="465">IN4</text><text x="648" y="505">EEP</text>
  </g>
  <g text-anchor="end" fill="#1c2430">
    <text x="812" y="365">OUT1</text><text x="812" y="395">OUT2</text>
    <text x="812" y="455">OUT3</text><text x="812" y="485">OUT4</text>
  </g>

  <!-- motors -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M820 360 H890 M820 390 H890" stroke="#2f6fd6"/>
    <path d="M820 450 H890 M820 480 H890" stroke="#e08a1e"/>
  </g>
  <g stroke="#555c66" stroke-width="2" fill="#eceef1">
    <circle cx="905" cy="375" r="26"/><circle cx="905" cy="465" r="26"/>
  </g>
  <g text-anchor="middle" font-weight="bold" fill="#1c2430"><text x="905" y="381">M</text><text x="905" y="471">M</text></g>
  <text x="905" y="338" text-anchor="middle" fill="#5a6472" font-size="13">left motor (front)</text>
  <text x="905" y="510" text-anchor="middle" fill="#5a6472" font-size="13">right motor (rear)</text>

  <!-- bulk capacitor -->
  <g stroke="#1c2430" stroke-width="4" stroke-linecap="round">
    <path d="M962 380 H998" stroke="#d6362b"/><path d="M962 396 H998"/><path d="M980 396 V420" />
  </g>
  <text x="972" y="372" fill="#d6362b" font-weight="bold" text-anchor="end">+</text>
  <text x="1030" y="436" text-anchor="end" fill="#1c2430" font-size="13">220 µF</text>
  <text x="1030" y="453" text-anchor="end" fill="#1c2430" font-size="13">6.3 V+</text>
  <text x="990" y="218" text-anchor="end" fill="#5a6472" font-size="13">capacitor: recommended, solder it</text>
  <text x="990" y="235" text-anchor="end" fill="#5a6472" font-size="13">across the driver's VCC and GND</text>
</svg>
